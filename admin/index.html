<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>文章管理 - Promethean</title>

  <!-- 防闪烁：在渲染前确定主题 -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', saved || preferred);
    })();
  </script>

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- EasyMDE 编辑器 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.css">

  <!-- 博客主题样式 + 管理后台样式 -->
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/admin.css' | relative_url }}">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="admin-navbar">
    <div class="admin-navbar-inner">
      <a href="#/posts" class="admin-brand" id="adminBrand">
        <i class="fas fa-pen-nib"></i> 文章管理
      </a>
      <div class="admin-navbar-actions">
        <a href="{{ '/' | relative_url }}" class="admin-btn admin-btn-ghost">
          <i class="fas fa-home"></i> <span class="hide-mobile">返回博客</span>
        </a>
        <button class="admin-btn admin-btn-ghost" id="themeToggle" title="切换主题">
          <i class="fa-solid fa-sun" id="themeIcon"></i>
        </button>
        <span id="userInfo" class="admin-user d-none"></span>
        <button id="logoutBtn" class="admin-btn admin-btn-danger d-none">
          <i class="fas fa-sign-out-alt"></i> <span class="hide-mobile">退出</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="admin-main">

    <!-- ========== 登录视图 ========== -->
    <div id="view-login" class="view">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <i class="fas fa-lock"></i>
            <h2>管理登录</h2>
          </div>
          <div class="login-body">
            <div class="form-group">
              <label class="form-label">GitHub Personal Access Token</label>
              <input type="password" id="tokenInput" class="form-input"
                     placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
                     autocomplete="off">
              <p class="form-hint">
                需要 Contents (Read/Write) 权限。
                <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">
                  创建 Token <i class="fas fa-external-link-alt"></i>
                </a>
              </p>
            </div>
            <button id="loginBtn" class="admin-btn admin-btn-primary w-full">
              <i class="fas fa-sign-in-alt"></i> 验证并登录
            </button>
            <div id="loginError" class="alert-error d-none"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 文章列表视图 ========== -->
    <div id="view-posts" class="view d-none">
      <div class="posts-header">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="postsSearchInput" class="form-input" placeholder="搜索文章...">
        </div>
        <a href="#/editor/new" class="admin-btn admin-btn-primary">
          <i class="fas fa-plus"></i> 新建文章
        </a>
      </div>
      <!-- 已发布 / 草稿 Tab -->
      <div class="posts-tabs">
        <button class="posts-tab active" id="tabPublished" data-tab="published">
          <i class="fas fa-check-circle"></i> 已发布
          <span class="tab-count" id="tabPublishedCount"></span>
        </button>
        <button class="posts-tab" id="tabDrafts" data-tab="drafts">
          <i class="fas fa-file-alt"></i> 草稿
          <span class="tab-count" id="tabDraftsCount"></span>
        </button>
      </div>

      <div id="postsList" class="posts-list"></div>
      <div id="postsLoading" class="loading-state">
        <div class="spinner"></div>
        <p>加载文章列表...</p>
      </div>
      <div id="postsEmpty" class="empty-state d-none">
        <i class="fas fa-inbox"></i>
        <p>暂无文章</p>
      </div>
    </div>

    <!-- ========== 编辑器视图 ========== -->
    <div id="view-editor" class="view d-none">

      <!-- GitHub 风格编辑器 -->
      <div class="gh-editor">
        <!-- 文件名头部 -->
        <div class="gh-editor-header">
          <button id="backToListBtn" class="gh-back-btn">
            <i class="fas fa-arrow-left"></i>
          </button>
          <i class="fas fa-file-code gh-file-icon"></i>
          <span class="gh-filename" id="editorFilename">_posts/new-post.md</span>
          <span id="saveStatus" class="save-status"></span>
        </div>

        <!-- Front Matter 折叠区域 -->
        <details class="gh-meta-section" open>
          <summary class="gh-meta-toggle">
            <i class="fas fa-caret-down"></i> File properties (Front Matter)
          </summary>
          <div class="gh-meta-body">
            <div class="gh-meta-row">
              <div class="gh-meta-field gh-meta-title">
                <label class="gh-label">title</label>
                <input type="text" id="postTitle" class="gh-input" placeholder="文章标题">
              </div>
            </div>
            <div class="gh-meta-row">
              <div class="gh-meta-field">
                <label class="gh-label">date</label>
                <input type="date" id="postDate" class="gh-input">
              </div>
              <div class="gh-meta-field">
                <label class="gh-label">categories</label>
                <input type="text" id="postCategories" class="gh-input" placeholder="逗号分隔">
              </div>
              <div class="gh-meta-field">
                <label class="gh-label">location</label>
                <input type="text" id="postLocation" class="gh-input" placeholder="城市">
              </div>
            </div>
            <div class="gh-meta-row">
              <div class="gh-meta-field" style="flex:1">
                <label class="gh-label">excerpt</label>
                <textarea id="postExcerpt" class="gh-input" rows="2" placeholder="简短摘要..."></textarea>
              </div>
            </div>
          </div>
        </details>

        <!-- Edit / Preview 标签页 -->
        <div class="gh-tabs">
          <button class="gh-tab active" id="ghTabEdit">
            <i class="fas fa-code"></i> Edit file
          </button>
          <button class="gh-tab" id="ghTabPreview">
            <i class="fas fa-eye"></i> Preview
          </button>
        </div>

        <!-- 编辑区 -->
        <div class="gh-editor-body" id="ghEditorBody">
          <textarea id="markdown-editor"></textarea>
        </div>

        <!-- 预览区 -->
        <div class="gh-preview-body d-none" id="ghPreviewBody"></div>

        <!-- 底部 Commit 区域 -->
        <div class="gh-commit-section">
          <div class="gh-commit-header">
            <i class="fas fa-code-commit"></i> Commit changes
          </div>
          <div class="gh-commit-body">
            <input type="text" class="gh-input gh-commit-title" id="commitTitle" placeholder="Update post...">
            <textarea class="gh-input gh-commit-desc" id="commitDesc" placeholder="Add an optional extended description..." rows="2"></textarea>
            <div class="gh-commit-actions">
              <button id="saveDraftBtn" class="gh-btn gh-btn-secondary">
                <i class="fas fa-file-alt"></i> Save as draft
              </button>
              <button id="publishBtn" class="gh-btn gh-btn-primary">
                <i class="fas fa-check"></i> Commit changes
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- 删除确认模态框 -->
  <div class="modal-overlay d-none" id="deleteModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>确认删除</h3>
        <button class="modal-close" id="deleteModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <p>确定要删除文章 <strong id="deletePostName"></strong> 吗？</p>
        <p class="text-danger">此操作不可撤销！</p>
      </div>
      <div class="modal-footer">
        <button class="admin-btn admin-btn-ghost" id="deleteCancelBtn">取消</button>
        <button class="admin-btn admin-btn-danger" id="confirmDeleteBtn">确认删除</button>
      </div>
    </div>
  </div>

  <!-- 文章预览模态框 -->
  <div class="modal-overlay d-none" id="previewModal">
    <div class="modal-box modal-box-preview">
      <div class="modal-header">
        <h3 id="previewTitle">文章预览</h3>
        <button class="modal-close" id="previewModalClose">&times;</button>
      </div>
      <div class="modal-body preview-body" id="previewBody">
        <div id="previewLoading" class="preview-loading">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
        <div id="previewError"   class="preview-error d-none"></div>
        <div id="previewMeta"    class="preview-meta  d-none"></div>
        <div id="previewContent" class="preview-content d-none"></div>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast d-none"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="{{ '/assets/js/admin.js' | relative_url }}"></script>
</body>
</html>
