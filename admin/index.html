<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>文章管理 - Promethean</title>

  <!-- 防闪烁：在渲染前确定主题 -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', saved || preferred);
    })();
  </script>

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- EasyMDE 编辑器 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.css">

  <!-- 博客主题样式 + 管理后台样式 -->
  <link rel="stylesheet" href="/assets/css/blog.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="admin-navbar">
    <div class="admin-navbar-inner">
      <a href="#/posts" class="admin-brand">
        <i class="fas fa-pen-nib"></i> 文章管理
      </a>
      <div class="admin-navbar-actions">
        <a href="/" class="admin-btn admin-btn-ghost">
          <i class="fas fa-home"></i> <span class="hide-mobile">返回博客</span>
        </a>
        <button class="admin-btn admin-btn-ghost" id="themeToggle" title="切换主题">
          <i class="fa-solid fa-sun" id="themeIcon"></i>
        </button>
        <span id="userInfo" class="admin-user d-none"></span>
        <button id="logoutBtn" class="admin-btn admin-btn-danger d-none">
          <i class="fas fa-sign-out-alt"></i> <span class="hide-mobile">退出</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="admin-main">

    <!-- ========== 登录视图 ========== -->
    <div id="view-login" class="view">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <i class="fas fa-lock"></i>
            <h2>管理登录</h2>
          </div>
          <div class="login-body">
            <div class="form-group">
              <label class="form-label">GitHub Personal Access Token</label>
              <input type="password" id="tokenInput" class="form-input"
                     placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
                     autocomplete="off">
              <p class="form-hint">
                需要 Contents (Read/Write) 权限。
                <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">
                  创建 Token <i class="fas fa-external-link-alt"></i>
                </a>
              </p>
            </div>
            <button id="loginBtn" class="admin-btn admin-btn-primary w-full">
              <i class="fas fa-sign-in-alt"></i> 验证并登录
            </button>
            <div id="loginError" class="alert-error d-none"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 文章列表视图 ========== -->
    <div id="view-posts" class="view d-none">
      <div class="posts-header">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="postsSearchInput" class="form-input" placeholder="搜索文章...">
        </div>
        <a href="#/editor/new" class="admin-btn admin-btn-primary">
          <i class="fas fa-plus"></i> 新建文章
        </a>
      </div>
      <div id="postsList" class="posts-list"></div>
      <div id="postsLoading" class="loading-state">
        <div class="spinner"></div>
        <p>加载文章列表...</p>
      </div>
      <div id="postsEmpty" class="empty-state d-none">
        <i class="fas fa-inbox"></i>
        <p>暂无文章</p>
      </div>
    </div>

    <!-- ========== 编辑器视图 ========== -->
    <div id="view-editor" class="view d-none">
      <div class="editor-header">
        <button id="backToListBtn" class="admin-btn admin-btn-ghost">
          <i class="fas fa-arrow-left"></i> 返回列表
        </button>
        <div class="editor-actions">
          <span id="saveStatus" class="save-status"></span>
          <button id="publishBtn" class="admin-btn admin-btn-primary">
            <i class="fas fa-paper-plane"></i> 发布
          </button>
        </div>
      </div>

      <!-- Front Matter 表单 -->
      <div class="editor-meta">
        <div class="meta-row">
          <div class="meta-field meta-title">
            <input type="text" id="postTitle" class="form-input form-input-lg" placeholder="文章标题">
          </div>
        </div>
        <div class="meta-row">
          <div class="meta-field">
            <label class="form-label">日期</label>
            <input type="date" id="postDate" class="form-input">
          </div>
          <div class="meta-field">
            <label class="form-label">分类</label>
            <input type="text" id="postCategories" class="form-input" placeholder="逗号分隔">
          </div>
          <div class="meta-field">
            <label class="form-label">地点</label>
            <input type="text" id="postLocation" class="form-input" placeholder="城市">
          </div>
        </div>
        <div class="meta-row">
          <div class="meta-field" style="flex:1">
            <label class="form-label">摘要（显示在文章列表中）</label>
            <textarea id="postExcerpt" class="form-input" rows="2" placeholder="一段简短的中文摘要..."></textarea>
          </div>
        </div>
      </div>

      <!-- Markdown 编辑器 -->
      <div class="editor-wrapper">
        <textarea id="markdown-editor"></textarea>
      </div>
    </div>

  </main>

  <!-- 删除确认模态框 -->
  <div class="modal-overlay d-none" id="deleteModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>确认删除</h3>
        <button class="modal-close" id="deleteModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <p>确定要删除文章 <strong id="deletePostName"></strong> 吗？</p>
        <p class="text-danger">此操作不可撤销！</p>
      </div>
      <div class="modal-footer">
        <button class="admin-btn admin-btn-ghost" id="deleteCancelBtn">取消</button>
        <button class="admin-btn admin-btn-danger" id="confirmDeleteBtn">确认删除</button>
      </div>
    </div>
  </div>

  <!-- 左侧卡通角色 -->
  <div class="mascots-panel" id="mascotsPanel">

    <!-- 角色1：紫色矩形（EyeBall×2） -->
    <div class="mascot mascot-purple" id="m-purple">
      <div class="mascot-face" id="m-purple-face">
        <div class="eyeball" data-max-dist="5"><div class="eyeball-pupil"></div></div>
        <div class="eyeball" data-max-dist="5"><div class="eyeball-pupil"></div></div>
      </div>
    </div>

    <!-- 角色2：黑色矩形（EyeBall×2） -->
    <div class="mascot mascot-black" id="m-black">
      <div class="mascot-face" id="m-black-face">
        <div class="eyeball" data-max-dist="4"><div class="eyeball-pupil"></div></div>
        <div class="eyeball" data-max-dist="4"><div class="eyeball-pupil"></div></div>
      </div>
    </div>

    <!-- 角色3：橙色宽拱（bare Pupil×2） -->
    <div class="mascot mascot-orange" id="m-orange">
      <div class="mascot-face" id="m-orange-face">
        <div class="pupil" data-max-dist="5"></div>
        <div class="pupil" data-max-dist="5"></div>
      </div>
    </div>

    <!-- 角色4：黄色窄拱（bare Pupil×2 + 嘴巴） -->
    <div class="mascot mascot-yellow" id="m-yellow">
      <div class="mascot-face" id="m-yellow-face">
        <div class="pupil" data-max-dist="5"></div>
        <div class="pupil" data-max-dist="5"></div>
      </div>
      <div class="mascot-mouth" id="m-yellow-mouth"></div>
    </div>

  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast d-none"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
