# Site settings
title: Meng Guo Wan
description: Meng Guo Wan
favicon: /assets/img/avatar.JPG
baseurl:
url: https://mengguowan.github.io
rss_url:

# Build settings

highlight: true
#highlighter: rouge

timezone: Asia/Shanghai

markdown: commonmark

# 启用归档功能
collections:
  archives:
    output: true
    permalink: /archives/:year/:month/:day/:title/

# 默认设置
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      show_in_archives: true
      
