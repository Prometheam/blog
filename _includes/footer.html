<!-- Service Worker 注册 -->

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}')
        .catch(function(err) { console.warn('SW registration failed:', err); });
    });
  }
</script>
