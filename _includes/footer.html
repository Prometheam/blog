<!-- Service Worker 注册 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('{{ "/sw.js" | prepend: site.baseurl }}')
        .catch(function(err) { console.warn('SW registration failed:', err); });
    });
  }
</script>
