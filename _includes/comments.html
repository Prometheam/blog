<div class="comments-section">
  <h3 class="comments-title"><i class="fa-regular fa-comments"></i> 评论</h3>
  <div id="utterances-container"></div>
  <script>
    (function () {
      // 读取当前主题，保证初始加载时评论与页面主题一致
      var theme = document.documentElement.getAttribute('data-theme') === 'light'
        ? 'github-light' : 'github-dark';
      var s = document.createElement('script');
      s.src = 'https://utteranc.es/client.js';
      s.setAttribute('repo', 'Prometheam/blog');
      s.setAttribute('issue-term', 'pathname');
      s.setAttribute('label', '💬 评论');
      s.setAttribute('theme', theme);
      s.setAttribute('crossorigin', 'anonymous');
      s.async = true;
      document.getElementById('utterances-container').appendChild(s);
    })();
  </script>
</div>
