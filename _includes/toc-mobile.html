<!-- 移动端 TOC 浮动按钮 + 抽屉（仅 ≤992px 生效） -->
<button class="toc-mobile-btn" id="tocMobileBtn" aria-label="文章目录" title="文章目录">
  <i class="fa-solid fa-list"></i>
</button>
<div class="toc-mobile-overlay" id="tocMobileOverlay"></div>
<div class="toc-mobile-drawer" id="tocMobileDrawer" aria-label="文章目录">
  <div class="toc-mobile-header">
    <span><i class="fa-solid fa-list"></i> 目录</span>
    <button class="toc-mobile-close" id="tocMobileClose" aria-label="关闭目录">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <ul class="toc-list" id="tocListMobile"></ul>
</div>
