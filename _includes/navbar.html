<nav class="navbar">
  <div class="navbar-inner">
    <!-- Logo/标题 -->
    <a href="{{ '/' | relative_url }}" class="navbar-brand">
      {{ site.data.blog.title }}
    </a>

    <!-- 移动端菜单按钮 -->
    <button class="navbar-toggler" id="navToggler" aria-label="打开菜单">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- 导航菜单 -->
    <div class="navbar-menu" id="navbarMenu">
      {% for item in site.data.navigation %}
        {% if item.dropdown %}
          <div class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link" aria-haspopup="true" aria-expanded="false" id="dropdown-{{ item.name | slugify }}">
              <i class="{{ item.icon }}"></i>
              <span>{{ item.name }}</span>
              <i class="dropdown-icon fa-solid fa-angle-down"></i>
            </a>
            <ul class="dropdown-menu" role="menu" aria-labelledby="dropdown-{{ item.name | slugify }}">
              {% for subitem in item.dropdown %}
                <li role="none">
                  <a href="{{ subitem.url | relative_url }}" role="menuitem">
                    <i class="{{ subitem.icon }}"></i>
                    <span>{{ subitem.name }}</span>
                  </a>
                </li>
              {% endfor %}
            </ul>
          </div>
        {% else %}
          <div class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link">
              <i class="{{ item.icon }}"></i>
              <span>{{ item.name }}</span>
            </a>
          </div>
        {% endif %}
      {% endfor %}

      <!-- 搜索按钮 -->
      <button class="search-toggle" id="searchToggle" aria-label="搜索" title="搜索">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- 主题切换按钮 -->
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
      </button>
    </div>
  </div>
</nav>

<!-- 搜索弹窗 -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-modal">
    <div class="search-header">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索文章... (Ctrl+K)" autocomplete="off">
      <button class="search-close" id="searchClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-hint">输入至少 2 个字符搜索文章...</div>
    </div>
  </div>
</div>
