<nav class="navbar">
  <div class="navbar-inner">
    <!-- Logo/标题 -->
    <a href="{{ site.baseurl }}/" class="navbar-brand">
      {{ site.data.blog.title }}
    </a>

    <!-- 移动端菜单按钮 -->
    <button class="navbar-toggler" id="navToggler" aria-label="打开菜单">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- 导航菜单 -->
    <div class="navbar-menu" id="navbarMenu">
      {% for item in site.data.navigation %}
        {% if item.dropdown %}
          <div class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link">
              <i class="{{ item.icon }}"></i>
              <span>{{ item.name }}</span>
              <i class="dropdown-icon fa-solid fa-angle-down"></i>
            </a>
            <ul class="dropdown-menu">
              {% for subitem in item.dropdown %}
                <li>
                  <a href="{{ subitem.url | relative_url }}">
                    <i class="{{ subitem.icon }}"></i>
                    <span>{{ subitem.name }}</span>
                  </a>
                </li>
              {% endfor %}
            </ul>
          </div>
        {% else %}
          <div class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link">
              <i class="{{ item.icon }}"></i>
              <span>{{ item.name }}</span>
            </a>
          </div>
        {% endif %}
      {% endfor %}

      <!-- 搜索按钮 -->
      <button class="search-toggle" id="searchToggle" aria-label="搜索" title="搜索">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- 主题切换按钮 -->
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
      </button>
    </div>
  </div>
</nav>

<script>
// 移动端菜单切换
document.addEventListener('DOMContentLoaded', function() {
  var toggler = document.getElementById('navToggler');
  var menu = document.getElementById('navbarMenu');
  if (toggler && menu) {
    toggler.addEventListener('click', function() {
      menu.classList.toggle('active');
      var icon = toggler.querySelector('i');
      if (menu.classList.contains('active')) {
        icon.className = 'fa-solid fa-xmark';
      } else {
        icon.className = 'fa-solid fa-bars';
      }
    });
  }

  // 移动端下拉菜单
  var dropdowns = document.querySelectorAll('.nav-item');
  dropdowns.forEach(function(item) {
    var link = item.querySelector('.dropdown-icon');
    if (link && window.innerWidth <= 992) {
      item.querySelector('.nav-link').addEventListener('click', function(e) {
        if (item.querySelector('.dropdown-menu')) {
          e.preventDefault();
          item.classList.toggle('open');
        }
      });
    }
  });

  // 搜索功能
  var searchToggle = document.getElementById('searchToggle');
  var searchOverlay = document.getElementById('searchOverlay');
  var searchInput = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');
  var searchClose = document.getElementById('searchClose');
  var searchData = null;

  function openSearch() {
    searchOverlay.classList.add('active');
    searchInput.value = '';
    searchResults.innerHTML = '<div class="search-hint">输入至少 2 个字符搜索文章...</div>';
    setTimeout(function() { searchInput.focus(); }, 100);
  }

  function closeSearch() {
    searchOverlay.classList.remove('active');
  }

  if (searchToggle) {
    searchToggle.addEventListener('click', openSearch);
  }
  if (searchClose) {
    searchClose.addEventListener('click', closeSearch);
  }
  if (searchOverlay) {
    searchOverlay.addEventListener('click', function(e) {
      if (e.target === searchOverlay) closeSearch();
    });
  }

  // Ctrl+K / Cmd+K 快捷键
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      openSearch();
    }
    if (e.key === 'Escape' && searchOverlay.classList.contains('active')) {
      closeSearch();
    }
  });

  // 加载搜索数据
  function loadSearchData(callback) {
    if (searchData) { callback(searchData); return; }
    // 显示加载中状态
    searchResults.innerHTML = '<div class="search-hint"><i class="fa-solid fa-spinner fa-spin"></i> 加载中...</div>';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/search.json', true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        searchData = JSON.parse(xhr.responseText);
        callback(searchData);
      }
    };
    xhr.send();
  }

  // 搜索逻辑
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      var query = this.value.trim().toLowerCase();
      if (query.length < 2) {
        searchResults.innerHTML = '<div class="search-hint">输入至少 2 个字符搜索文章...</div>';
        return;
      }
      loadSearchData(function(data) {
        var results = data.filter(function(post) {
          return post.title.toLowerCase().indexOf(query) !== -1 ||
                 post.excerpt.toLowerCase().indexOf(query) !== -1 ||
                 post.categories.join(' ').toLowerCase().indexOf(query) !== -1;
        });
        if (results.length === 0) {
          searchResults.innerHTML = '<div class="search-empty">没有找到相关文章</div>';
        } else {
          var html = results.slice(0, 10).map(function(post) {
            return '<a href="' + post.url + '" class="search-result-item">' +
              '<div class="search-result-title">' + post.title + '</div>' +
              '<div class="search-result-meta">' + post.date +
              (post.categories.length ? ' · ' + post.categories.join(', ') : '') +
              '</div></a>';
          }).join('');
          searchResults.innerHTML = html;
        }
      });
    });
  }
});
</script>

<!-- 搜索弹窗 -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-modal">
    <div class="search-header">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索文章... (Ctrl+K)" autocomplete="off">
      <button class="search-close" id="searchClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-hint">输入至少 2 个字符搜索文章...</div>
    </div>
  </div>
</div>
