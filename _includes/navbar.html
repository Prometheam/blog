<nav class="navbar">
  <div class="navbar-inner">
    <!-- Logo/标题 -->
    <a href="{{ site.baseurl }}/" class="navbar-brand">
      {{ site.data.blog.title }}
    </a>

    <!-- 移动端菜单按钮 -->
    <button class="navbar-toggler" id="navToggler" aria-label="打开菜单">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- 导航菜单 -->
    <div class="navbar-menu" id="navbarMenu">
      {% for item in site.data.navigation %}
        {% if item.dropdown %}
          <div class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link">
              <i class="{{ item.icon }}"></i>
              <span>{{ item.name }}</span>
              <i class="dropdown-icon fa-solid fa-angle-down"></i>
            </a>
            <ul class="dropdown-menu">
              {% for subitem in item.dropdown %}
                <li>
                  <a href="{{ subitem.url | relative_url }}">
                    <i class="{{ subitem.icon }}"></i>
                    <span>{{ subitem.name }}</span>
                  </a>
                </li>
              {% endfor %}
            </ul>
          </div>
        {% else %}
          <div class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link">
              <i class="{{ item.icon }}"></i>
              <span>{{ item.name }}</span>
            </a>
          </div>
        {% endif %}
      {% endfor %}

      <!-- 主题切换按钮 -->
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
      </button>
    </div>
  </div>
</nav>

<script>
// 移动端菜单切换
document.addEventListener('DOMContentLoaded', function() {
  var toggler = document.getElementById('navToggler');
  var menu = document.getElementById('navbarMenu');
  if (toggler && menu) {
    toggler.addEventListener('click', function() {
      menu.classList.toggle('active');
      var icon = toggler.querySelector('i');
      if (menu.classList.contains('active')) {
        icon.className = 'fa-solid fa-xmark';
      } else {
        icon.className = 'fa-solid fa-bars';
      }
    });
  }

  // 移动端下拉菜单
  var dropdowns = document.querySelectorAll('.nav-item');
  dropdowns.forEach(function(item) {
    var link = item.querySelector('.dropdown-icon');
    if (link && window.innerWidth <= 992) {
      item.querySelector('.nav-link').addEventListener('click', function(e) {
        if (item.querySelector('.dropdown-menu')) {
          e.preventDefault();
          item.classList.toggle('open');
        }
      });
    }
  });
});
</script>
