{% assign author = site.data.author %}
{% if page.layout == "post_layout" or page.layout == "post" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.updated | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": {{ author.name | jsonify }},
    "url": "{{ '/about/' | absolute_url }}"
  },
  "publisher": {
    "@type": "Person",
    "name": {{ author.name | jsonify }}
  },
  "image": "{{ page.image | default: '/assets/img/avatar.svg' | absolute_url }}",
  "url": "{{ page.url | absolute_url }}",
  "description": {{ page.excerpt | strip_html | strip_newlines | truncate: 160 | jsonify }}
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": "{{ site.url }}",
  "description": {{ site.description | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ author.name | jsonify }},
    "url": "{{ '/about/' | absolute_url }}"
  }
}
</script>
{% endif %}
