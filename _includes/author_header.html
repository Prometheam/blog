<div class="author-header">
  <img src="{{ site.data.author.gavatar }}" alt="头像" class="author-avatar">
  <div class="author-info">
    <h2>{{ site.data.author.name }}</h2>
    <p><strong>{{ site.data.author.title }}</strong></p>
    <p><i class="fa-solid fa-location-dot"></i> {{ site.data.author.address }}</p>
    <div class="author-links">
      <a href="https://github.com/{{ site.data.author.github }}" target="_blank">
        <i class="fa-brands fa-github"></i> {{ site.data.author.github }}
      </a>
      <a href="mailto:{{ site.data.author.email }}">
        <i class="fa-solid fa-envelope"></i> {{ site.data.author.email }}
      </a>
    </div>
  </div>
</div>
